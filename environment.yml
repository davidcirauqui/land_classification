name: land_classification
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=2.5
  - pandas=3.1
  - matplotlib=3.11
  - scikit-learn=1.9
  - libblas=*=*openblas    # not MKL: MKL's OpenMP clashes with torch's
  - ipykernel
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1+cu130
      - torchvision==0.29.1+cu130
